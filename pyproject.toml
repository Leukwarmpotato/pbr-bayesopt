[project]
name = "pbr-bayesopt"
version = "0.1.0"
description = "Bayesian optimisation of a tubular photobioreactor model"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "scipy>=1.12",
]

[project.scripts]
pbr-bayesopt = "pbr_bayesopt.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pbr_bayesopt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
